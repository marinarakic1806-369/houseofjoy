<div style="min-height:100vh;display:flex;gap:48px;flex-wrap:wrap;justify-content:center;align-items:center;padding:32px;font-family:Inter,sans-serif">

      <iframe src="netlify/index.html" title="Desktop" style="width:1400px;height:1040px;border:0;transform:scale(.5);transform-origin:0 0;background:#F4EDE2;display:block"></iframe>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#8A6A28">Srpski</div>
    <div style="width:390px;height:844px;padding:12px;border-radius:56px;background:#1D1A17;box-shadow:0 30px 60px rgba(0,0,0,.25)">

  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <div style="font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#8A6A28">English</div>

      <iframe src="netlify/en.html" title="Phone EN" style="width:100%;height:100%;border:0;border-radius:44px;background:#F4EDE2;display:block"></iframe>
    </div>
  </div>
</div>
